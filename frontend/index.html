<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Core SEO ──────────────────────────────────────────────── -->
    <title>SatGuard — Orbital Intelligence Platform</title>
    <meta name="description" content="Real-time satellite collision avoidance, safe-slot search, and mission planning. Built with SGP4 propagation, CesiumJS visualization, and deterministic conjunction analysis." />
    <meta name="author" content="SatGuard Team — SkyHack 2.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050510" />

    <!-- ── Open Graph (Facebook, LinkedIn, Discord, Slack) ───────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SatGuard" />
    <meta property="og:title" content="SatGuard — Orbital Intelligence Platform" />
    <meta property="og:description" content="Real-time satellite collision avoidance, safe-slot search, and mission planning. Built with SGP4 propagation, CesiumJS visualization, and deterministic conjunction analysis." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SatGuard — Orbital Intelligence Platform preview" />
    <meta property="og:locale" content="en_US" />
    <!--
      TODO: Replace with your actual deployment URL once live.
      LinkedIn and other crawlers require an absolute URL for og:image.
      Example: <meta property="og:url" content="https://satguard.vercel.app" />
      Example: <meta property="og:image" content="https://satguard.vercel.app/og-image.png" />
    -->

    <!-- ── Twitter Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SatGuard — Orbital Intelligence Platform" />
    <meta name="twitter:description" content="Real-time satellite collision avoidance, safe-slot search, and mission planning." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="SatGuard dashboard showing 3D orbital visualization" />

    <!-- ── Favicons & App Meta ───────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ── Fonts (preconnected for performance) ──────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
